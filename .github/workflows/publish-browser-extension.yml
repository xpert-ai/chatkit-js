name: Package Browser Extension

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  package-release:
    name: Package browser extension release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect browser extension version change
        id: browser_extension
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(node -p "require('./packages/browser-extension/package.json').version")"
          previous_version=""

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            base_sha="${{ github.event.workflow_run.head_sha }}^"
            previous_version="$(
              git show "$base_sha:packages/browser-extension/package.json" 2>/dev/null \
                | node -e "let input = ''; process.stdin.on('data', (chunk) => input += chunk); process.stdin.on('end', () => console.log(input ? JSON.parse(input).version : ''));"
            )"
          fi

          if [[ "${{ github.event_name }}" == "workflow_run" && "$previous_version" == "$current_version" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

      - name: Build browser extension package
        id: package_browser_extension
        if: steps.browser_extension.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.browser_extension.outputs.version }}"
          zip_name="chatkit-browser-extension-$version.zip"
          zip_path="$RUNNER_TEMP/$zip_name"

          pnpm --filter @xpert-ai/chatkit-browser-extension type-check
          pnpm --filter @xpert-ai/chatkit-host-automation test
          pnpm --filter @xpert-ai/chatkit-browser-extension test
          pnpm --filter @xpert-ai/chatkit-browser-extension build

          cd packages/browser-extension/dist/chrome
          zip -r "$zip_path" .
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Upload browser extension workflow artifact
        if: steps.browser_extension.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chatkit-browser-extension-${{ steps.browser_extension.outputs.version }}
          path: ${{ steps.package_browser_extension.outputs.zip_path }}

      - name: Attach browser extension zip to GitHub Release
        if: steps.browser_extension.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.browser_extension.outputs.version }}
          ZIP_NAME: ${{ steps.package_browser_extension.outputs.zip_name }}
          ZIP_PATH: ${{ steps.package_browser_extension.outputs.zip_path }}
        run: |
          set -euo pipefail

          release_tag="chatkit-browser-extension-v$VERSION"
          release_title="ChatKit Browser Extension v$VERSION"
          release_notes="Chrome extension package for @xpert-ai/chatkit-browser-extension v$VERSION."
          target_sha="$(git rev-parse HEAD)"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$ZIP_PATH#$ZIP_NAME" --clobber
          else
            gh release create "$release_tag" "$ZIP_PATH#$ZIP_NAME" \
              --target "$target_sha" \
              --title "$release_title" \
              --notes "$release_notes"
          fi
