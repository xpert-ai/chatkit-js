name: Package Word Add-in

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/word-addin/**'
      - '.github/workflows/package-word-addin.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - 'packages/word-addin/**'
      - '.github/workflows/package-word-addin.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  package-word-addin:
    name: Build Word add-in
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter @xpert-ai/chatkit-word-addin type-check

      - name: Test
        run: pnpm --filter @xpert-ai/chatkit-word-addin test

      - name: Build
        env:
          ADDIN_BASE_URL: https://localhost:3001
        run: pnpm --filter @xpert-ai/chatkit-word-addin build

      - name: Validate manifest
        run: pnpm --filter @xpert-ai/chatkit-word-addin validate:manifest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatkit-word-addin
          path: |
            packages/word-addin/dist/manifest.xml
            packages/word-addin/dist/taskpane/**
            packages/word-addin/dist/server/**
            packages/word-addin/README.md
            packages/word-addin/env.example
